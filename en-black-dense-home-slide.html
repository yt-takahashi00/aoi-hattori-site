<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Slideshow | AOI HATTORI</title>
<link rel="stylesheet" href="style-black-dense.css">
<style>
.slide-stage { position: fixed; inset: 0; background: var(--bg); }
.slide-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.6s ease; }
.slide-img.on { opacity: 1; }
.slide-name { position: fixed; top: 22px; left: 24px; z-index: 3; font-size: 15px; letter-spacing: .3em; color: var(--ink); }
.slide-enter { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 3; opacity: 0; pointer-events: none; transition: opacity 1.6s ease; font-size: 13px; letter-spacing: .35em; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.slide-enter.show { opacity: 1; pointer-events: auto; }
.slide-switcher { position: fixed; right: 14px; bottom: 12px; z-index: 3; background: var(--bg); opacity: .92; padding: 2px 8px; }
</style>
</head>
<body>
<div class="slide-stage">
  <img class="slide-img" src="img-simulation.jpg" alt="SIMULATION">
  <img class="slide-img" src="img-one-round.jpg" alt="ONE ROUND">
  <img class="slide-img" src="img-diversity-painting.jpg" alt="A Painting on the Use of Diversity for the Sake of Expression">
  <img class="slide-img" src="img-succession-no2.jpg" alt="Succession No.2">
  <img class="slide-img" src="img-mountain-armor.jpg" alt="Mountain-Devouring Armor">
  <img class="slide-img" src="img-food-additives.jpg" alt="Food additives and Surrealism">
  <img class="slide-img" src="img-take-back-love.jpg" alt="Take back the love!!">
  <img class="slide-img" src="img-messiah-light.jpg" alt="Messiah of the Land of Light">
  <img class="slide-img" src="img-two-kaiju.jpg" alt="Two Kaiju">
</div>
<div class="slide-name">AOI HATTORI</div>
<a class="slide-enter" href="en-black-dense-works.html">WORKS</a>
<div class="slide-switcher"><div class="wrap">
  <nav class="variant-switch" aria-label="表示の切り替え">
    <span class="group"><span class="label">Layout:</span><a href="en-black-home-slide.html">Standard</a><a href="en-black-small-home-slide.html">Small</a><span class="current">Dense</span></span>
    <span class="group"><span class="label">Background:</span><a href="en-dense-home-slide.html">White</a><span class="current">Black</span></span>
    <span class="group"><span class="label">Language:</span><a href="black-dense-home-slide.html">日本語</a><span class="current">English</span></span>
  </nav>
</div>
</div>
<script>
(function () {
  var slides = document.querySelectorAll(".slide-img");
  var i = 0;
  function show(n) {
    slides.forEach(function (el, k) { el.classList.toggle("on", k === n); });
  }
  if (slides.length) {
    show(0);
    setInterval(function () { i = (i + 1) % slides.length; show(i); }, 4000);
  }
  var enter = document.querySelector(".slide-enter");
  function reveal() { if (enter) enter.classList.add("show"); }
  setTimeout(reveal, 9000);
  document.addEventListener("click", reveal);
})();
</script>
</body>
</html>
